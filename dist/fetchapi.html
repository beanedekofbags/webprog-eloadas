<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API CRUD</title>
    
    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./src/assets/css/global.css">
    <link rel="stylesheet" href="./src/assets/css/fetchapi.css">
</head>
<body>
    <div id="container">
        <header>
            <h1 class="headertext">FETCH API CRUD</h1>
        </header>
        <div class="navigation">
            <a class="navbutton" href="./index.html">FŐOLDAL</a>
            <a class="navbutton" href="./javascript.html">JAVASCRIPT</a>
            <a class="navbutton" href="./react.html">REACT</a>
            <a class="navbutton" href="./spa.html">SPA</a>
            <a class="navbutton">FETCH API</a>
            <a class="navbutton" href="./axios.html">AXIOS</a>
            <a class="navbutton" href="./oojs.html">OOJS</a>
        </div>
        <main>
            <form class="textbox" id="registration">
                <p id="message"></p>
                <h1 id="addedit"></h3>
                <input type="hidden" id="az">
                
                <label for="pizzanev" class="section">Pizza neve</label>
                <input type="text" id="pizzanev" placeholder="Pizzanév" required>

                <label for="darab" class="section">Darabszám</label>
                <input type="number" id="darab" placeholder="darab" required>

                <label for="felvetel" class="section">Felvétel időpontja</label>
                <input type="datetime-local" id="felvetel" required>

                <label for="kiszallitas" class="section">Kiszállítás időpontja</label>
                <input type="datetime-local" id="kiszallitas" required>
                
                <button>Mentés</button>
            </form>
            <div class="textbox" id="table-display">
                <div class="table">
                    <div class="row title-row">
                        <div class="cell">Id</div>
                        <div class="cell">Pizza neve</div>
                        <div class="cell">Darabszám</div>
                        <div class="cell">Felvétel időpontja</div>
                        <div class="cell">Teljesítés időpontja</div>
                        <div class="cell">Módosít</div>
                    </div>
                    <div id="order-contents"></div>
                </div>
            </div>
            <script src="./src/fetchapi.js"></script>
        </main>
        <footer>
            <span class="authortext">
                Készítette:
                <br>
                Tót Benedek (NZL3EF) & Palotai Péter (CVIZYT)
            </span>
        </footer>
    </div>
</body>
</html>
