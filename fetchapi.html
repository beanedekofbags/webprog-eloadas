        <main>
        <div class="textbox" id="left">
            <p id="message"></p>
            <h1 id="addedit"></h3>
            <form id="OrderForm">
                <input type="hidden" id="az">
                <div>
                    <label for="pizzanev" class="section">Pizza neve</label>
                    <input type="text" id="pizzanev" placeholder="Pizzanév" required>

                    <label for="darab" class="section">Darabszám</label>
                    <input type="number" id="darab" placeholder="darab" required>

                    <label for="felvetel" class="section">Felvétel időpontja</label>
                    <input type="datetime-local" id="felvetel" required>

                    <label for="kiszallitas" class="section">Kiszállítás időpontja</label>
                    <input type="datetime-local" id="kiszallitas" required>
                    <div>
                        <button>Mentés</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="textbox">
            <table>
                <thead>
                <tr>
                        <th>Id</th>
                        <th>Pizza neve</th>
                        <th>Darabszám</th>
                        <th>Felvétel időpontja</th>
                        <th>Teljesítés időpontja</th>
                        <th width="250">Módosít</th>
                </tr>
            </thead>

                <tbody id="OrderTable"></tbody>
            </table>
        </div>
